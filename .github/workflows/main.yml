name: Dockerfile scans and image publishing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Dockerfile with Hadolint
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }},target=/workspace,readonly" \
            --workdir /workspace \
            --entrypoint /bin/hadolint \
            hadolint/hadolint:v2.15.1 Dockerfile

      - name: Check Dockerfile with Checkov
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }},target=/workspace,readonly" \
            --workdir /workspace \
            --entrypoint checkov \
            ghcr.io/bridgecrewio/checkov:3.4.3 \
            --file Dockerfile --framework dockerfile --skip-download --compact

      - name: Check Dockerfile with Semgrep
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }},target=/workspace,readonly" \
            --workdir /workspace \
            --entrypoint semgrep \
            semgrep/semgrep:1.183.0 \
            scan --config p/dockerfile --error --strict --metrics=off Dockerfile

      - name: Check Dockerfile with Trivy
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }}/Dockerfile,target=/scan/Dockerfile,readonly" \
            aquasec/trivy:0.76.1 \
            config --exit-code 1 --misconfig-scanners dockerfile /scan

      - name: Build Docker image
        run: |
          docker build --pull --tag checkov:build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .

      - name: Tag Docker image with latest Git tag
        id: image
        shell: bash
        run: |
          mapfile -t tags < <(git tag --sort=-version:refname)
          tag="${tags[0]:-0}"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::The latest Git tag is not a valid Docker image tag."
            exit 1
          fi
          docker tag checkov:build "checkov:$tag"
          docker tag checkov:build checkov:latest
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "Built image tags: checkov:$tag and checkov:latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan Docker image with Trivy
        run: |
          docker run --rm \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            aquasec/trivy:0.76.1 \
            image --image-src docker --scanners vuln --exit-code 1 checkov:build

      - name: Log in to Docker Hub
        if: >-
          ${{ success() && github.event_name != 'pull_request' &&
              (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
               startsWith(github.ref, 'refs/tags/')) }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push Docker image to Docker Hub
        if: >-
          ${{ success() && github.event_name != 'pull_request' &&
              (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
               startsWith(github.ref, 'refs/tags/')) }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          IMAGE_NAME="docker.io/${DOCKERHUB_USERNAME,,}/checkov"
          docker tag checkov:build "$IMAGE_NAME:$IMAGE_VERSION"
          docker tag checkov:build "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$IMAGE_VERSION"
          docker push "$IMAGE_NAME:latest"
          echo "Published: $IMAGE_NAME:$IMAGE_VERSION and $IMAGE_NAME:latest" >> "$GITHUB_STEP_SUMMARY"
