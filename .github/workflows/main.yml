name: Dockerfile scans and image publishing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare artifact directory
        run: |
          REPORT_DIR="$RUNNER_TEMP/checkov-reports"
          mkdir -p "$REPORT_DIR"
          echo "REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"

      - name: Check Dockerfile with Hadolint
        id: hadolint
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }},target=/workspace,readonly" \
            --workdir /workspace \
            --entrypoint /bin/hadolint \
            hadolint/hadolint:v2.15.1 --format json Dockerfile \
            2> >(tee "$REPORT_DIR/hadolint.log" >&2) | tee "$REPORT_DIR/hadolint.json"

      - name: Check Dockerfile with Checkov
        id: checkov
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }},target=/workspace,readonly" \
            --workdir /workspace \
            --entrypoint checkov \
            ghcr.io/bridgecrewio/checkov:3.4.3 \
            --file Dockerfile --framework dockerfile --skip-download --output json \
            2> >(tee "$REPORT_DIR/checkov.log" >&2) | tee "$REPORT_DIR/checkov.json"

      - name: Check Dockerfile with Semgrep
        id: semgrep
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }},target=/workspace,readonly" \
            --workdir /workspace \
            --entrypoint semgrep \
            semgrep/semgrep:1.183.0 \
            scan --config p/dockerfile --error --strict --metrics=off --json Dockerfile \
            2> >(tee "$REPORT_DIR/semgrep.log" >&2) | tee "$REPORT_DIR/semgrep.json"

      - name: Check Dockerfile with Trivy
        id: trivy_dockerfile
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          docker run --rm \
            --mount "type=bind,source=${{ github.workspace }}/Dockerfile,target=/scan/Dockerfile,readonly" \
            aquasec/trivy:0.76.1 \
            config --exit-code 1 --misconfig-scanners dockerfile --format json /scan \
            2> >(tee "$REPORT_DIR/trivy-dockerfile.log" >&2) | tee "$REPORT_DIR/trivy-dockerfile.json"

      - name: Build Docker image
        id: build
        run: |
          docker build --pull --no-cache --tag checkov:build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" . \
            2>&1 | tee "$REPORT_DIR/build.log"

      - name: Tag Docker image with latest Git tag
        id: image
        shell: bash
        run: |
          mapfile -t tags < <(git tag --sort=-version:refname)
          tag="${tags[0]:-0}"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::The latest Git tag is not a valid Docker image tag."
            exit 1
          fi
          docker tag checkov:build "checkov:$tag"
          docker tag checkov:build checkov:latest
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "Built image tags: checkov:$tag and checkov:latest" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect checkov:build > "$REPORT_DIR/image-metadata.json"

      - name: Scan Docker image with Trivy
        id: trivy_image
        run: |
          docker run --rm \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock \
            aquasec/trivy:0.76.1 \
            image --image-src docker --scanners vuln --exit-code 1 --format json \
            --skip-dirs /tmp/checkov-venv --skip-dirs .git --skip-dirs '**/.git' checkov:build \
            2> >(tee "$REPORT_DIR/trivy-image.log" >&2) | tee "$REPORT_DIR/trivy-image.json"

      - name: Log in to Docker Hub
        if: >-
          ${{ success() && github.event_name != 'pull_request' &&
              (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
               startsWith(github.ref, 'refs/tags/')) }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push Docker image to Docker Hub
        if: >-
          ${{ success() && github.event_name != 'pull_request' &&
              (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
               startsWith(github.ref, 'refs/tags/')) }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          IMAGE_NAME="docker.io/${DOCKERHUB_USERNAME,,}/checkov"
          docker tag checkov:build "$IMAGE_NAME:$IMAGE_VERSION"
          docker tag checkov:build "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$IMAGE_VERSION"
          docker push "$IMAGE_NAME:latest"
          echo "Published: $IMAGE_NAME:$IMAGE_VERSION and $IMAGE_NAME:latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Hadolint reports
        if: ${{ always() && steps.hadolint.outcome != 'skipped' && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hadolint-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkov-reports/hadolint.*
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Checkov reports
        if: ${{ always() && steps.checkov.outcome != 'skipped' && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkov-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkov-reports/checkov.*
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Semgrep reports
        if: ${{ always() && steps.semgrep.outcome != 'skipped' && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkov-reports/semgrep.*
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Trivy Dockerfile reports
        if: ${{ always() && steps.trivy_dockerfile.outcome != 'skipped' && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-dockerfile-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkov-reports/trivy-dockerfile.*
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Trivy image reports
        if: ${{ always() && steps.trivy_image.outcome != 'skipped' && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checkov-reports/trivy-image.*
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build artifacts
        if: ${{ always() && steps.build.outcome != 'skipped' && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checkov-reports/build.log
            ${{ runner.temp }}/checkov-reports/image-metadata.json
          retention-days: 14
          if-no-files-found: warn
